<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website SMP Al-Islamiyah</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    iframe {
      position: absolute;
      top: -28px; /* Menggeser iframe ke atas untuk menyembunyikan banner */
      left: 0;
      width: 100%;
      height: calc(100% + 28px); /* Menyesuaikan tinggi agar bagian bawah tidak terpotong */
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- Pastikan X-Frame-Options sudah di set ALLOWALL di Apps Script -->
    <iframe src="https://script.google.com/macros/s/AKfycbyLoOzYAiFbj2xzKsxJ-JYStARUZ1mcI-I8dvtAChjpPNWQX3KQYKDrtu3u1PA9yquU/exec"></iframe>
  </div>
</body>
</html>
