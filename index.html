<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karya Tulis - SMP Al-Islamiyah</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        /* Trik memotong banner peringatan Google */
        .iframe-container iframe {
            position: absolute;
            top: -12px; /* Geser iframe ke atas sejauh 36px */
            left: 0;
            width: 100%;
            height: calc(100vh + 36px); /* Tambah tinggi agar bagian bawah tidak terpotong */
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- Link Apps Script Anda sudah saya masukkan di bawah ini -->
        <iframe src="https://script.google.com/macros/s/AKfycbwrwvdreZImko4pTMSmXm3sAWTFF2x1yyADRRAFaC_R8NtNiKGBrskxEZFtBkQ8Nhjf/exec"></iframe>
    </div>
</body>
</html>
